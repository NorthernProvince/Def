<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Excellence Foundation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 800px;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: #FFCC00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 60px;
            font-weight: 900;
            color: #000;
        }
        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .yellow { color: #FFCC00; }
        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #ccc;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #FFCC00;
            color: #000;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .badge {
            display: inline-block;
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.3);
            color: #FFCC00;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">D</div>
        <div class="badge">● Championing Excellence Since 2015</div>
        <h1>DISTRICT <span class="yellow">EXCELLENCE</span> FOUNDATION</h1>
        <p>Promoting a culture of excellence across all workplaces — from small businesses to large corporations. Recognising hard work. Inspiring competition.</p>
        <a href="#learn-more" class="btn">Learn More</a>
    </div>
</body>
</html>
